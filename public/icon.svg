<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Matte Warm Darkroom Obsidian Lacquer -->
    <linearGradient id="bg" x1="48" y1="32" x2="464" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#25201B"/>
      <stop offset="55%" stop-color="#171411"/>
      <stop offset="100%" stop-color="#100E0C"/>
    </linearGradient>

    <!-- Subtle Ambient Darkroom Warmth -->
    <radialGradient id="glow" cx="196" cy="188" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E9C982" stop-opacity="0.11"/>
      <stop offset="58%" stop-color="#C9A258" stop-opacity="0.025"/>
      <stop offset="100%" stop-color="#141210" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Gilded Bevel Rim -->
    <linearGradient id="rim" x1="36" y1="36" x2="476" y2="476" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F2DA9E" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#C8A054" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8E6C32" stop-opacity="0.36"/>
    </linearGradient>

    <!-- Champagne-Gold Widescreen Gate -->
    <linearGradient id="gold" x1="80" y1="120" x2="432" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6E1AC"/>
      <stop offset="54%" stop-color="#D5AF66"/>
      <stop offset="100%" stop-color="#AE843B"/>
    </linearGradient>

    <!-- Diagonal Silver-Ivory Projector Beam (光) -->
    <linearGradient id="beam" x1="112" y1="144" x2="356" y2="368" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="52%" stop-color="#F5E7C6"/>
      <stop offset="100%" stop-color="#D7B570" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Matte Cinnabar-Vermilion Archival Seal (志) -->
    <linearGradient id="seal" x1="306" y1="166" x2="386" y2="246" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DA4C39"/>
      <stop offset="100%" stop-color="#AC2F20"/>
    </linearGradient>

    <!-- Inner Cinema Screen Mat Clip -->
    <clipPath id="screen-clip">
      <rect x="104" y="144" width="304" height="224" rx="12"/>
    </clipPath>
  </defs>

  <!-- Outer Darkroom Obsidian Squircle -->
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#glow)"/>
  <rect x="13" y="13" width="486" height="486" rx="111" stroke="url(#rim)" stroke-width="4"/>

  <!-- Delicate 35mm Cinema Leader Ticks (Top & Bottom) -->
  <g fill="url(#gold)" opacity="0.46">
    <rect x="128" y="81.6" width="41.6" height="13.6" rx="6.8"/>
    <rect x="235.2" y="81.6" width="41.6" height="13.6" rx="6.8"/>
    <rect x="342.4" y="81.6" width="41.6" height="13.6" rx="6.8"/>
    <rect x="128" y="416.8" width="41.6" height="13.6" rx="6.8"/>
    <rect x="235.2" y="416.8" width="41.6" height="13.6" rx="6.8"/>
    <rect x="342.4" y="416.8" width="41.6" height="13.6" rx="6.8"/>
  </g>

  <!-- Widescreen Cinema Gate Frame (影) -->
  <rect x="81.6" y="121.6" width="348.8" height="268.8" rx="28.8" fill="#12100E" stroke="url(#gold)" stroke-width="14.5"/>

  <!-- Clipped Chiaroscuro Projection Stage -->
  <g clip-path="url(#screen-clip)">
    <!-- Soft Ambient Light Falloff -->
    <polygon points="104,144 268,144 408,368 168,368" fill="#E8C984" fill-opacity="0.1"/>
    <!-- Primary Diagonal Shaft of Projector Light (光) -->
    <polygon points="104,144 214.4,144 356,368 185.6,368" fill="url(#beam)"/>
    <!-- Crisp Architectural Light Edge -->
    <line x1="214.4" y1="144" x2="356" y2="368" stroke="#FFFDF8" stroke-width="3" stroke-opacity="0.42"/>
  </g>

  <!-- Matte Cinnabar-Vermilion Archival Square Seal (志) -->
  <rect x="305.6" y="164.8" width="78.4" height="78.4" rx="15" fill="url(#seal)"/>
  <rect x="319.6" y="178.8" width="50.4" height="50.4" rx="7" stroke="#FAF4E8" stroke-width="4.5" stroke-opacity="0.45"/>
</svg>
