<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#221E1A"/>
      <stop offset="100%" stop-color="#141210"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C84635"/>
      <stop offset="100%" stop-color="#9A2D1F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6E2A8"/>
      <stop offset="50%" stop-color="#D4AF6A"/>
      <stop offset="100%" stop-color="#A67C37"/>
    </linearGradient>
  </defs>

  <!-- Archival Obsidian Frame -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="28" y="28" width="456" height="456" rx="88" fill="none" stroke="url(#gold)" stroke-opacity="0.4" stroke-width="4"/>

  <!-- Left & Right 35mm Cinema Sprocket Holes -->
  <g fill="#F7F5F0" fill-opacity="0.18">
    <rect x="52" y="102" width="24" height="34" rx="7"/>
    <rect x="52" y="170" width="24" height="34" rx="7"/>
    <rect x="52" y="238" width="24" height="34" rx="7"/>
    <rect x="52" y="306" width="24" height="34" rx="7"/>
    <rect x="52" y="374" width="24" height="34" rx="7"/>

    <rect x="436" y="102" width="24" height="34" rx="7"/>
    <rect x="436" y="170" width="24" height="34" rx="7"/>
    <rect x="436" y="238" width="24" height="34" rx="7"/>
    <rect x="436" y="306" width="24" height="34" rx="7"/>
    <rect x="436" y="374" width="24" height="34" rx="7"/>
  </g>

  <!-- Central Archival Crimson Seal Plate -->
  <rect x="114" y="114" width="284" height="284" rx="44" fill="url(#seal)"/>
  <rect x="130" y="130" width="252" height="252" rx="32" fill="none" stroke="#FAF7F0" stroke-opacity="0.38" stroke-width="3"/>

  <!-- Minimalist Film Aperture + Star Emblem -->
  <circle cx="256" cy="256" r="78" fill="none" stroke="url(#gold)" stroke-width="10"/>
  <circle cx="256" cy="256" r="46" fill="none" stroke="#FAF7F0" stroke-opacity="0.88" stroke-width="5"/>
  <path d="M238 228 L286 256 L238 284 Z" fill="#FAF7F0"/>

  <!-- Corner Gold Registration Marks -->
  <circle cx="152" cy="152" r="5" fill="url(#gold)"/>
  <circle cx="360" cy="152" r="5" fill="url(#gold)"/>
  <circle cx="152" cy="360" r="5" fill="url(#gold)"/>
  <circle cx="360" cy="360" r="5" fill="url(#gold)"/>
</svg>
