<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="光影志">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#211E1A" />
      <stop offset="100%" stop-color="#141210" />
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7E4A6" />
      <stop offset="50%" stop-color="#E4C37A" />
      <stop offset="100%" stop-color="#B98D38" />
    </linearGradient>
    <linearGradient id="vermilion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C94534" />
      <stop offset="100%" stop-color="#9A2B1D" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#foil)" stroke-width="3" stroke-opacity="0.55" />

  <!-- 35mm film sprocket accents -->
  <g fill="#E4C37A" fill-opacity="0.42">
    <rect x="46" y="116" width="22" height="34" rx="6" />
    <rect x="46" y="180" width="22" height="34" rx="6" />
    <rect x="46" y="244" width="22" height="34" rx="6" />
    <rect x="46" y="308" width="22" height="34" rx="6" />
    <rect x="46" y="372" width="22" height="34" rx="6" />

    <rect x="444" y="116" width="22" height="34" rx="6" />
    <rect x="444" y="180" width="22" height="34" rx="6" />
    <rect x="444" y="244" width="22" height="34" rx="6" />
    <rect x="444" y="308" width="22" height="34" rx="6" />
    <rect x="444" y="372" width="22" height="34" rx="6" />
  </g>

  <!-- Vermilion archival seal stamp -->
  <rect x="108" y="108" width="296" height="296" rx="48" fill="url(#vermilion)" stroke="url(#foil)" stroke-width="4" />
  <rect x="128" y="128" width="256" height="256" rx="34" fill="none" stroke="#F7E4A6" stroke-width="2" stroke-opacity="0.5" />

  <text
    x="256"
    y="324"
    text-anchor="middle"
    fill="#FAF5EB"
    font-size="188"
    font-weight="600"
    font-family="'Songti SC', 'Noto Serif SC', 'Source Han Serif SC', SimSun, Georgia, serif"
  >影</text>
</svg>
