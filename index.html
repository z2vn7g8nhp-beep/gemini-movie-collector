<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F7F5F0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="光影志" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600;700&display=swap"
    />
    <title>光影志 · 个人影视、影人与角色收藏馆</title>
    <meta
      name="description"
      content="支持 GitHub Pages 独立部署与离线安装使用的个人影视、影人与角色收藏档案馆。"
    />
    <meta property="og:title" content="光影志 · 个人影视、影人与角色收藏馆" />
    <meta
      property="og:description"
      content="支持 GitHub Pages 独立部署与离线安装使用的个人影视、影人与角色收藏档案馆。"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem('cinearchive.theme.v1');
          var isDark =
            saved === 'dark' ||
            (saved !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', isDark);
          root.style.colorScheme = isDark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isDark ? '#141210' : '#F7F5F0');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F7F5F0] text-[#1A1816] antialiased overflow-x-clip selection:bg-[#B43B2B]/15 selection:text-[#8E2A1D] dark:bg-[#141210] dark:text-[#F3EFE6] dark:selection:bg-[#E8725F]/25 dark:selection:text-[#FAF7F0]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
